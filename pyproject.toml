[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot-ai"
version = "0.1.0"
description = "CareerPilot AI resume and job matching analysis tool"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CareerPilot AI" }]
dependencies = [
  "streamlit",
  "pandas",
  "numpy",
  "scikit-learn",
  "pymupdf",
  "pytesseract",
  "Pillow",
  "fastapi>=0.111.0",
  "uvicorn",
  "pytest",
  "httpx>=0.27.0",
  "ruff",
  "requests",
]

[project.scripts]
careerpilot = "careerpilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
